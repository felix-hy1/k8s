apiVersion: batch/v1
kind: CronJob
metadata:
  name: timing
  namespace: ds-lab
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid      # 上一轮没跑完则跳过本轮
  successfulJobsHistoryLimit: 3  # 保留 3 个成功 Job 便于查日志
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: timing-date
              image: busybox:1.36
              command: ["sh", "-c", "date"]
