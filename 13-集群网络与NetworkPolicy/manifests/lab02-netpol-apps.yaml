# 实验 2:策略实验对象 —— frontend(允许)与 client(不允计)访问 backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: net-lab
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: hashicorp/http-echo:1.0
          args: ["-text=hello from backend", "-listen=:8080"]
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: net-lab
spec:
  selector: { app: backend }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: net-lab
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: busybox:1.36
          command: ["sleep", "3600"]
