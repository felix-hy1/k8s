# 实验 3:Secret(Opaque)创建与两种注入
apiVersion: v1
kind: Secret
metadata:
  name: db-cred
  namespace: cfg-lab
type: Opaque
stringData:                 # 明文写,apiserver 自动 base64
  username: "app"
  password: "P@ssw0rd!"
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  namespace: cfg-lab
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "env | grep DB_; cat /etc/secret/password; sleep 3600"]
      env:
        - name: DB_USER
          valueFrom: { secretKeyRef: { name: db-cred, key: username } }
        - name: DB_PASS
          valueFrom: { secretKeyRef: { name: db-cred, key: password } }
      volumeMounts:
        - name: cred
          mountPath: /etc/secret        # 挂载方式(推荐):username/password 两个文件
          readOnly: true
  volumes:
    - name: cred
      secret: { secretName: db-cred, defaultMode: 0400 }   # 权限收紧:仅属主可读
---
# kubernetes.io/tls 类型(第 09 章 Ingress 已实践,这里声明式写法):
# kubectl create secret tls demo-tls --cert=tls.crt --key=tls.key
