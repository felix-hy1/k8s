# 实验 2:RollingUpdate vs Recreate 策略对比
apiVersion: v1
kind: Namespace
metadata:
  name: strategy-lab
---
# 滚动更新:逐步替换,不中断服务(默认)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roll-web
  namespace: strategy-lab
spec:
  replicas: 3
  selector:
    matchLabels: { app: roll-web }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0           # 全程保持 3 个可用
  template:
    metadata:
      labels: { app: roll-web }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 3
---
# 重建:先杀全部旧 Pod 再建新的 —— 有明确停机窗口
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recreate-web
  namespace: strategy-lab
spec:
  replicas: 3
  selector:
    matchLabels: { app: recreate-web }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: recreate-web }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 3
