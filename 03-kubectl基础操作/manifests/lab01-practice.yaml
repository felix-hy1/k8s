# 第 03 章练习环境:一个用于练手的 Deployment
apiVersion: v1
kind: Namespace
metadata:
  name: kubectl-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: kubectl-lab
  labels:
    app: shop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
