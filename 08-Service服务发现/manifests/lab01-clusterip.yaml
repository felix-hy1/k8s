# 实验 1:ClusterIP(默认类型,集群内访问)
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: svc-lab
spec:
  type: ClusterIP                 # 默认值,可省略
  selector:
    app: web                      # 选中 lab00 的三个 whoami Pod
  ports:
    - name: http
      port: 80                    # Service VIP 上的端口(客户端访问用)
      targetPort: 80              # 容器端口
