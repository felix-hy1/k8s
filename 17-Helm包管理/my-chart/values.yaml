# my-chart 默认值(安装时可用 -f 或 --set 覆盖)

replicaCount: 2

image:
  repository: nginx
  tag: "1.27"                # 固定 tag,别用 latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false             # true 时渲染 ingress.yaml
  className: nginx
  host: chart.demo.local

autoscaling:
  enabled: false             # true 时渲染 hpa.yaml
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

config:
  message: "hello from helm chart"

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 200m, memory: 256Mi }

# 可选:节点选择与容忍(空 = 不限制)
nodeSelector: {}
tolerations: []
