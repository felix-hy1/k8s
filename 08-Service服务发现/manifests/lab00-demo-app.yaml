# 实验 0:演示应用(页面显示 Pod 名,便于观察负载均衡)
apiVersion: v1
kind: Namespace
metadata:
  name: svc-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: svc-lab
spec:
  replicas: 3
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10        # 返回 Hostname 等请求信息,轻量好用
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 3
