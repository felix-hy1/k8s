# 实验 1:Pod 基本字段
apiVersion: v1
kind: Namespace
metadata:
  name: pod-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: basic
  namespace: pod-lab
  labels:
    app: basic
spec:
  restartPolicy: Always            # Always | OnFailure | Never
  containers:
    - name: nginx
      image: nginx:1.27
      imagePullPolicy: IfNotPresent  # Always | IfNotPresent | Never
      ports:
        - name: http
          containerPort: 80
      env:
        - name: MESSAGE                    # 直接写值
          value: "hello k8s"
        - name: POD_NAME                   # Downward API:引用 Pod 自身信息
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
