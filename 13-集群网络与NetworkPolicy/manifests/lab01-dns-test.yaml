# 实验 1:DNS 排查工具 Pod
apiVersion: v1
kind: Namespace
metadata:
  name: net-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: dnsutils
  namespace: net-lab
spec:
  containers:
    - name: dnsutils
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3   # 官方 DNS 排查镜像
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: net-lab
  labels: { app: client }
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
