apiVersion: v1
kind: Pod
metadata:
  name: broken-pod
  namespace: pod-lab
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      livenessProbe:
        httpGet: {path: /, port: 80}
        initialDelaySeconds: 3
        periodSeconds: 10
        failureThreshold: 4
