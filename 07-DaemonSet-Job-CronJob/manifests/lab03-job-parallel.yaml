# 实验 3:并行 Job + 失败重试
# parallel-job:6 个任务、每次并行 2 个(观察 Pod 两两创建)
apiVersion: batch/v1
kind: Job
metadata:
  name: parallel-job
  namespace: ds-lab
spec:
  completions: 6          # 总共成功 6 个
  parallelism: 2          # 同时跑 2 个
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: work
          image: busybox:1.36
          command:
            - sh
            - -c
            - "echo task-${JOB_COMPLETION_INDEX} done; sleep 5"
          env:
            - name: JOB_COMPLETION_INDEX     # 内置任务索引 0..5
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
---
# bad-job:必然失败,演示 backoffLimit 重试与最终 Failed
apiVersion: batch/v1
kind: Job
metadata:
  name: bad-job
  namespace: ds-lab
spec:
  backoffLimit: 3          # 最多重试 3 次
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: fail
          image: busybox:1.36
          command: ["sh", "-c", "echo 'I will fail'; exit 1"]
