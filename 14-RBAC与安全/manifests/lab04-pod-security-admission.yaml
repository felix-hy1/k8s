# 实验 4:Pod 安全准入(PSA)—— 用 Namespace 标签强制安全基线
apiVersion: v1
kind: Namespace
metadata:
  name: secure-ns
  labels:
    # enforce=违规直接拒绝;audit=记录违规;warn=仅提示
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ✅ 合规:满足 restricted(非 root、去 capabilities、seccomp)
apiVersion: v1
kind: Pod
metadata:
  name: compliant-pod
  namespace: secure-ns
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: app
      image: nginx:1.27-alpine
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        readOnlyRootFilesystem: false
---
# ❌ 违规:以 root 跑 + 特权容器 → 被 enforce 拒绝(apply 即报错)
apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged-pod
  namespace: secure-ns
spec:
  containers:
    - name: hack
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true          # restricted/baseline 都禁止
