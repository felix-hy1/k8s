# 完整 nginx 配置示例(可整体替换容器内 /etc/nginx/nginx.conf)
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 访问日志打到 stdout,便于 kubectl logs / 日志采集器收集
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        server_name _;

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        location /healthz {
            return 200 "ok\n";
            access_log off;
        }
    }
}
