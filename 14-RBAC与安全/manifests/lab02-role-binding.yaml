# 实验 2:Role + RoleBinding —— 命名空间内授权
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: rbac-lab
rules:
  - apiGroups: [""]                 # "" = 核心 apiGroup(pod/service/configmap...)
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"] # 只读三连
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]          # 部署只读
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: rbac-lab
subjects:
  - kind: ServiceAccount
    name: pod-reader                # 主体的三种类型:User / Group / ServiceAccount
    namespace: rbac-lab
  # - kind: User
  #   name: zhangsan                # 对应客户端证书的 CN=zhangsan
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
