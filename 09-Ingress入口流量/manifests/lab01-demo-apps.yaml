# 实验准备:两个演示应用 app1 / app2(nginx 页面自报身份)
apiVersion: v1
kind: Namespace
metadata:
  name: ing-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-index
  namespace: ing-lab
data:
  index.html: "<h1>I am APP-1 (v1)</h1>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app2-index
  namespace: ing-lab
data:
  index.html: "<h1>I am APP-2 (v2)</h1>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: ing-lab
spec:
  replicas: 2
  selector: { matchLabels: { app: app1 } }
  template:
    metadata: { labels: { app: app1 } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          volumeMounts:
            - name: index
              mountPath: /usr/share/nginx/html
      volumes:
        - name: index
          configMap: { name: app1-index }
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: ing-lab
spec:
  selector: { app: app1 }
  ports: [ { port: 80, targetPort: 80 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: ing-lab
spec:
  replicas: 2
  selector: { matchLabels: { app: app2 } }
  template:
    metadata: { labels: { app: app2 } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          volumeMounts:
            - name: index
              mountPath: /usr/share/nginx/html
      volumes:
        - name: index
          configMap: { name: app2-index }
---
apiVersion: v1
kind: Service
metadata:
  name: app2
  namespace: ing-lab
spec:
  selector: { app: app2 }
  ports: [ { port: 80, targetPort: 80 } ]
