# 实验 3:HPA 完整闭环(官方 php-apache 示例)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
  namespace: res-lab
spec:
  replicas: 1
  selector: { matchLabels: { run: php-apache } }
  template:
    metadata: { labels: { run: php-apache } }
    spec:
      containers:
        - name: php-apache
          image: registry.k8s.io/hpa-example        # 官方压测镜像(CPU 密集型页面)
          ports: [{ containerPort: 80 }]
          resources:
            # HPA 百分比 = 实际用量 / requests,requests 必须设
            requests: { cpu: 200m }
            limits: { cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: php-apache
  namespace: res-lab
spec:
  selector: { run: php-apache }
  ports: [{ port: 80 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache
  namespace: res-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50      # 目标:平均 CPU 50%
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0   # 扩容立即执行
    scaleDown:
      stabilizationWindowSeconds: 300 # 缩容等 5 分钟(默认)
---
# 压测发生器
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: res-lab
spec:
  containers:
    - name: load
      image: busybox:1.36
      command: ["sleep", "3600"]      # 起来先睡,实验时 exec 进去打流量
