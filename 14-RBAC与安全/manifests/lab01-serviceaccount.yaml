# 实验 1:ServiceAccount 与 Token 自动挂载开关
apiVersion: v1
kind: Namespace
metadata:
  name: rbac-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader
  namespace: rbac-lab
---
# 普通用法:自动挂载 SA Token(可访问 apiserver)
apiVersion: v1
kind: Pod
metadata:
  name: sa-default-pod
  namespace: rbac-lab
spec:
  serviceAccountName: pod-reader
  containers:
    - name: tools
      image: busybox:1.36
      command: ["sleep", "3600"]
---
# 安全收敛:不需要访问 apiserver 的应用关掉自动挂载
apiVersion: v1
kind: Pod
metadata:
  name: sa-no-mount
  namespace: rbac-lab
spec:
  automountServiceAccountToken: false     # Pod 级关闭
  containers:
    - name: app
      image: nginx:1.27
