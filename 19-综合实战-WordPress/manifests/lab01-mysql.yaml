# 第 1 层:MySQL(Namespace + Secret + 初始化 SQL + PVC + Deployment + Service)
apiVersion: v1
kind: Namespace
metadata:
  name: wordpress
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-cred
  namespace: wordpress
type: Opaque
stringData:
  password: "Root@123456"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: wordpress
data:
  01-init.sql: |
    -- 内容与 sql/init.sql 同步维护
    CREATE DATABASE IF NOT EXISTS wp_stats DEFAULT CHARACTER SET utf8mb4;
    USE wp_stats;
    CREATE TABLE IF NOT EXISTS deploy_log (
        id       INT AUTO_INCREMENT PRIMARY KEY,
        action   VARCHAR(100) NOT NULL,
        operator VARCHAR(50)  DEFAULT 'helm',
        created  TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    INSERT INTO deploy_log (action, operator) VALUES ('initial deploy via k8s', 'learner');
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: wordpress
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard        # kind 默认动态供给
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: wordpress
spec:
  replicas: 1
  strategy:
    type: Recreate                  # 有状态+RWO 卷:先删旧再建新,避免双写
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports: [{ containerPort: 3306 }]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-cred, key: password } }
            - name: MYSQL_DATABASE          # 镜像约定:自动建 wordpress 库
              value: wordpress
          volumeMounts:
            - { name: data,   mountPath: /var/lib/mysql }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: 500m, memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mysql-data }
        - name: initdb
          configMap: { name: mysql-init }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: wordpress
spec:
  type: ClusterIP                    # 只暴露给集群内,数据库绝不上 Ingress
  selector: { app: mysql }
  ports: [{ port: 3306, targetPort: 3306 }]
