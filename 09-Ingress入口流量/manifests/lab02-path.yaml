# 实验 1:同域名按路径路由 demo.local/app1 → app1, /app2 → app2
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: path-routing
  namespace: ing-lab
  annotations:
    # /app1/xxx → 后端收到 /xxx(把前缀剥掉)
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx          # 指定 ingress-nginx 控制器
  rules:
    - host: demo.local
      http:
        paths:
          - path: /app1(/|$)(.*)   # 正则前缀
            pathType: ImplementationSpecific
            backend:
              service:
                name: app1
                port: { number: 80 }
          - path: /app2(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: app2
                port: { number: 80 }
