# 实验 1:ConfigMap → 环境变量(单值 valueFrom + 整表 envFrom)
apiVersion: v1
kind: Namespace
metadata:
  name: cfg-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
  namespace: cfg-lab
data:
  APP_NAME: "order-service"       # 全部是字符串
  LOG_LEVEL: "debug"
  MAX_CONN: "100"
---
apiVersion: v1
kind: Pod
metadata:
  name: env-demo
  namespace: cfg-lab
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "env | sort; sleep 3600"]
      env:
        - name: APP_NAME                     # 方式一:单个键注入
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: APP_NAME
      envFrom:
        - configMapRef:                      # 方式二:整表注入(键名即变量名)
            name: app-settings
          prefix: CFG_                       # 加前缀避免变量名冲突
